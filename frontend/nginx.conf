# This is the Nginx configuration for serving the frontend and proxying the backend.

server {
    # Nginx will listen on port 80 inside the container.
    listen 80;

    # The root directory for serving static files (the React build output).
    root /usr/share/nginx/html;
    index index.html;

    # API Proxy: Any request to a path starting with /api will be
    # forwarded to the backend service.
    location /api {
        # 'backend' is the service name defined in docker-compose.yml.
        # Docker's internal DNS will resolve 'backend' to the backend container's IP address.
        proxy_pass http://backend:8000;
        
        # Standard headers to pass along to the backend.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback for Single-Page Applications (SPA):
    # If a request does not match any static file, it falls back to serving index.html.
    # This allows React Router to handle the routing on the client side.
    location / {
        try_files $uri /index.html;
    }
}
